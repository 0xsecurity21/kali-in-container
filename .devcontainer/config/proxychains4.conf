# proxychains4 for the Kali workstation.
#
# This chains a tool through a SOCKS listener reachable from inside the
# container on 127.0.0.1:1080. You must provide that listener; tools in this
# container already reach VPN targets through tun0, so proxychains is only for a
# client that cannot route itself. For macOS applications the working direction
# is the reverse: ssh -D from the host into this container. See README,
# "Burp Suite on the host against VPN-only targets".
#
# proxy_dns resolves names on the proxy side, which matters for VPN-only names.
strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5 127.0.0.1 1080
